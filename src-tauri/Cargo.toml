[package]
name = "adguard-home-console"
version = "1.0.0"
description = "AdGuard Home Console — Tauri 壳(Rust 代理 + 原生组件)"
edition = "2021"

# Tauri 2 移动端约定:lib 名 = 包名(下划线)+ _lib,gen/apple 工程按此链接
[lib]
name = "adguard_home_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# net/io-util/time 供 proxy.rs 单测的自起 TCP 服务器使用
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
thiserror = "2"
# iOS 液态玻璃 TabBar / macOS 玻璃组件(社区插件,sosweetham v0.1.8,MIT)
tauri-plugin-system-components = "0.1.8"

[profile.dev.package."*"]
opt-level = 0

# iOS 27 SDK 强制 UIScene 生命周期:Info.plist 必须声明 UIApplicationSceneManifest(引用 tao 的
# TaoSceneDelegate)。tao 0.35.3 已带 scene 支持,但在 release 构建下有 scene configuration
# 过早释放的 bug(上游 #1245 已修,0.37 未进入 tauri-runtime-wry 2.11.4 的依赖区间 ^0.35)。
# 这里 patch 到社区回迁分支(= 0.35.3 + #1245 五行修复,Argos-Dynamics 已在 iOS 26/27 验证)。
[patch.crates-io]
tao = { git = "https://github.com/Argos-Dynamics/tao", branch = "argos/0.35.3-scene-config-autorelease" }
