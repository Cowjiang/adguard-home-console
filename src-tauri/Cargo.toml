[package]
name = "adguard-home-console"
version = "1.0.0"
description = "AdGuard Home Console — Tauri 壳(Rust 代理 + 原生组件)"
edition = "2021"

# Tauri 2 mobile convention: lib name = package name (underscored) + _lib;
# the gen/apple project links against this name
[lib]
name = "adguard_home_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# net/io-util/time support the self-started TCP server in proxy.rs unit tests
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
thiserror = "2"
# iOS liquid-glass TabBar / macOS glass components (community plugin,
# sosweetham v0.1.8, MIT)
tauri-plugin-system-components = "0.1.8"

# iOS swipe-back gesture: after with_webview grabs the WKWebView pointer, use
# objc2 msg_send to call setAllowsBackForwardNavigationGestures (objc2-web-kit
# type bindings only support macOS)
[target."cfg(target_os = \"ios\")".dependencies]
objc2 = "0.6.4"

[profile.dev.package."*"]
opt-level = 0

# iOS 27's UIScene lifecycle needs tao's #1245 fix (the scene configuration was
# released before UIKit retained it, which only broke release builds). Upstream
# landed it in tao 0.37, and tauri-runtime-wry 2.12 (tauri 2.12) depends on that,
# so the community 0.35.3 backport this repo patched in until 2026-10-07 is gone.
[patch.crates-io]
# Local vendored fork: adds appearAnimation (entrance animation for native
# controls, used by the back button). Upstream 0.1.8 lacks it, and native
# controls float above the WebView, so the effect can only be done on the
# native side.
tauri-plugin-system-components = { path = "plugins/tauri-plugin-system-components" }
