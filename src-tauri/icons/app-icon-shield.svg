<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Recreates the top-left logo of the overview page's "protection on" card:
       accent-soft light green background + solid accent-green ShieldCheck -->
  <!-- Feedback tweaks: bigger shield (about 61%), outline changed to solid,
       checkmark cut out of the background color -->
  <rect width="1024" height="1024" fill="#DEF8EF"/>
  <g transform="translate(512 512) scale(26) translate(-12 -11.5)">
    <!-- Solid shield (same-color stroke keeps rounded corners) -->
    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
          fill="#34D399" stroke="#34D399" stroke-width="2" stroke-linejoin="round"/>
    <!-- Checkmark cut out of the background color -->
    <path d="m9 12 2 2 4-4" fill="none" stroke="#DEF8EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
