  <!-- Windows app icon: the same shield as app-icon-shield.svg, but on a squircle plate
       with a transparent margin. Windows does not mask Win32 app icons, so the shape has
       to be part of the artwork; do not feed this file to `tauri icon` for the iOS /
       Android / PWA assets, which are masked by the system and stay full-bleed.
       Plate: superellipse exponent 5.5, 900/1024 of the canvas (12.1% total margin).
       icon.ico is rasterized from this file (the PNG preview in _probe/ is not committed):
         npx tauri icon src-tauri/icons/app-icon-windows.svg -o <tmp dir>
         cp <tmp dir>/icon.ico src-tauri/icons/icon.ico
       The other platform assets stay driven by app-icon-shield.svg (full-bleed). -->
