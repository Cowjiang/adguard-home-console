<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2334d399'/%3E%3Cstop offset='1' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M32 4 10 12v14c0 15.4 9.2 26.6 22 34 12.8-7.4 22-18.6 22-34V12L32 4z'/%3E%3Cpath fill='%23fff' opacity='.92' d='M28.6 41.5 20 32.9l3.5-3.5 5.1 5.1 11.9-11.9 3.5 3.5-15.4 15.4z'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#07090f" />
    <script>
      // 主题引导:在首帧之前按存储设置应用主题,避免刷新闪浅色/深色
      // (与 src/lib/auth.tsx 的 THEME_KEY 及色值保持一致)
      (function () {
        try {
          var t = localStorage.getItem('agh.console.theme.v1') || 'auto';
          var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#07090f' : '#eef1f7');
        } catch (e) {
          /* 存储不可用时保持 HTML 默认深色 */
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="AdGuard Home 移动端控制台 — 现代玻璃质感的多平台 AdGuard Home 管理器" />
    <title>AdGuard Home Console · 移动控制台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
