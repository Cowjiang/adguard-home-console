<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2334d399'/%3E%3Cstop offset='1' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M32 4 10 12v14c0 15.4 9.2 26.6 22 34 12.8-7.4 22-18.6 22-34V12L32 4z'/%3E%3Cpath fill='%23fff' opacity='.92' d='M28.6 41.5 20 32.9l3.5-3.5 5.1 5.1 11.9-11.9 3.5 3.5-15.4 15.4z'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#07090f" />
    <script>
      // 首帧引导:按存储设置主题与语言,避免刷新闪浅色/深色或闪错语言
      // (与 src/lib/auth.tsx 的 THEME_KEY、src/lib/i18n 的 LANG_KEY 及词典保持一致)
      (function () {
        try {
          var t = localStorage.getItem('agh.console.theme.v1') || 'auto';
          var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#07090f' : '#eef1f7');
        } catch (e) {
          /* 存储不可用时保持 HTML 默认深色 */
        }
        var lang = 'en';
        try {
          var l = localStorage.getItem('agh.console.lang.v1');
          if (l === 'zh' || l === 'en') {
            lang = l;
          } else {
            var tags = navigator.languages || [navigator.language];
            for (var i = 0; i < tags.length; i++) {
              var tag = String(tags[i] || '').toLowerCase();
              if (tag.indexOf('zh') === 0) { lang = 'zh'; break; }
              if (tag.indexOf('en') === 0) { lang = 'en'; break; }
            }
          }
        } catch (e) { /* 存储不可用时保持英文 */ }
        var zh = lang === 'zh';
        document.documentElement.lang = zh ? 'zh-CN' : 'en';
        document.title = zh ? 'AdGuard Home Console · 移动控制台' : 'AdGuard Home Console · Mobile Console';
        var desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute('content', zh
          ? 'AdGuard Home 移动端控制台 — 现代玻璃质感的多平台 AdGuard Home 管理器'
          : 'AdGuard Home mobile console — a modern, glassy multi-platform AdGuard Home manager');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="AdGuard Home mobile console — a modern, glassy multi-platform AdGuard Home manager" />
    <title>AdGuard Home Console · Mobile Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 启动错误陷阱:WebView 内 JS 异常直接上屏(移动壳里无控制台时用于定位)
      window.addEventListener('error', function (e) {
        var el = document.getElementById('boot-err')
        if (!el) { el = document.createElement('pre'); el.id = 'boot-err'; document.body.appendChild(el) }
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;margin:0;padding:10px;background:#fee2e2;color:#991b1b;font-size:12px;white-space:pre-wrap;word-break:break-all'
        el.textContent += 'ERR: ' + (e.message || e.error || e) + '\n  at ' + (e.filename || '?') + ':' + (e.lineno || '?') + ':' + (e.colno || '?') + '\n'
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
