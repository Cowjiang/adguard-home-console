name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Proposal verification
        run: node scripts/verify-proposals.mjs

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Server proxy contract tests
        run: pnpm test:server

      - name: Release plan self-test
        run: pnpm test:release

      - name: Frontend build
        run: pnpm build

      - name: Verify npm packaging
        run: pnpm check:pack
