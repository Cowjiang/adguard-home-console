name: Release

# Release channel per 2026-09-25-open-source-webui-release: a semver tag
# produces the release tarball. GHCR image and npm package jobs land with the
# full release pipeline; pushes to branches no longer create releases.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package
        run: tar czf agh-console.tar.gz dist server package.json

      - name: Prepare release notes
        env:
          AFTER: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/release-notes.sh

      # Manual dispatches run the build for verification but only publish from a tag
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: agh-console.tar.gz
