name: Release

# Two channels, one build, three consumers: the GitHub Release tarball, the npm
# package and the GHCR image all carry the same version, computed once in the
# prepare job (scripts/release-plan.mjs; `node scripts/release-plan.mjs --self-test`
# pins the mapping).
#
#   nightly  schedule from `dev` / dispatch   Release <base>-nightly.<UTC date>.<sha>, prerelease
#                                              npm dist-tag nightly, image :nightly :<version> :sha-<sha>
#   stable   push tag vX.Y.Z                   Release vX.Y.Z
#                                              npm dist-tag latest,  image :latest :X.Y.Z :X.Y :sha-<sha>
#
# Nightlies are prereleases, so `releases/latest` (what scripts/server-pull.sh
# reads), the npm `latest` dist-tag and the `:latest` image stay on stable. A
# nightly whose `dev` has not moved since the last one is skipped, so idle days
# do not publish empty versions. Scheduled workflows only run from the default
# branch, so this file has to sit on `main` for the timer to fire at all.
on:
  schedule:
    # 19:17 UTC = 03:17 Asia/Shanghai. Off the hour on purpose: GitHub drops or
    # delays cron runs queued at high load, and the top of the hour is peak.
    - cron: '17 19 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the GitHub Release, npm and GHCR (default: dry run)'
        type: boolean
        default: false
      force:
        description: 'Rebuild even when dev has not moved since the last nightly'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      ref: ${{ steps.target.outputs.ref }}
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      package_name: ${{ steps.plan.outputs.package_name }}
      npm_tag: ${{ steps.plan.outputs.npm_tag }}
      docker_tags: ${{ steps.plan.outputs.docker_tags }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      skip: ${{ steps.changed.outputs.skip || 'false' }}
    steps:
      # The nightly tracks the integration branch, which is not the default
      # branch the schedule event reports; every other trigger builds its own ref.
      - name: Resolve the ref to build
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "ref=dev" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Resolve the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Plan the release
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ steps.target.outputs.ref }}
          SHA: ${{ steps.commit.outputs.sha }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: node scripts/release-plan.mjs

      # A nightly is derived from the commit, so an idle day must not mint a new
      # version. Tags come from the full-history checkout above.
      - name: Skip an unchanged nightly
        id: changed
        # force is the manual escape hatch: a dispatch is deliberate, the timer is not
        if: steps.plan.outputs.channel == 'nightly' && !inputs.force
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          last="$(git tag --list 'v*-nightly.*' --sort=-v:refname | head -1)"
          if [ -n "$last" ] && [ "$(git rev-parse "$last^{commit}")" = "$SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$last already points at $SHA — skipping this nightly"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The nightly is the dogfooding channel, so it only ships green code
      - name: Verify
        if: needs.prepare.outputs.channel == 'nightly'
        run: pnpm check && pnpm test && npm run test:server && pnpm test:release

      # Stamped once, then carried by the tarball, the npm package and the image
      - name: Stamp version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release-plan.mjs --set-version "$VERSION"

      - run: pnpm build

      - name: Pack and verify the npm tarball
        run: node scripts/check-npm-pack.mjs

      - name: Package the release tarball
        run: tar czf agh-console.tar.gz dist server package.json

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            agh-console.tar.gz
            *.tgz

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Prepare release notes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          BRANCH: ${{ needs.prepare.outputs.ref }}
        run: bash scripts/release-notes.sh

      # A nightly tag is derived from the commit, so re-running the same commit
      # must stay a no-op; a stable tag is explicit and its release is upserted.
      - name: Check for an existing nightly release
        id: check
        if: needs.prepare.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: needs.prepare.outputs.channel == 'stable' || steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          # github.sha is the default branch on a schedule event, so the nightly
          # tag would otherwise point at main instead of the dev commit it built
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: ${{ needs.prepare.outputs.release_tag }}
          body_path: release-notes.md
          files: agh-console.tar.gz
          prerelease: ${{ needs.prepare.outputs.prerelease }}

  npm:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The tarball is packed and verified by the build job; this step only ships
      # it, so what is published is exactly what was checked. Until the token
      # exists the channel warns and skips instead of failing the release.
      - name: Publish the verified tarball
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set — skipping the npm channel"
            exit 0
          fi
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published — nothing to do"
            exit 0
          fi
          npm publish ./*.tgz --tag "$NPM_TAG"
      # --provenance stays off on purpose: npm generates no attestations for
      # packages built from a private repository. Turn it on together with
      # `id-token: write` if this repository is ever made public.

  docker:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ needs.prepare.outputs.docker_tags }}
          labels: |
            org.opencontainers.image.title=AGH Console
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
