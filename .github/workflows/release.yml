name: Release

# Two channels, one build, four consumers: the GitHub Release tarball, the npm
# package and the GHCR image all carry the same version, computed once in the
# prepare job (scripts/release-plan.mjs; `node .github/scripts/release-plan.mjs --self-test`
# pins the mapping); the iOS IPA rides along on the Release as a fourth one,
# built by the `ios` job from the same ref (unsigned, no version stamp — see
# .agents/pipelines/proposals/process/2026-10-15-release-ipa-artifact.md).
#
#   nightly  schedule from `dev` / dispatch   one rolling prerelease, tag `nightly` moved to each build
#                                              npm dist-tag nightly, image :nightly :<version> :sha-<sha>
#   stable   push tag vX.Y.Z                   Release vX.Y.Z
#                                              npm dist-tag latest,  image :latest :X.Y.Z :X.Y :sha-<sha>
#
# The nightly rolls: its tag is force-moved to the newest build and the release
# is updated in place, so the release list holds exactly one nightly. Being a
# prerelease, it also leaves `releases/latest` (what scripts/server-pull.sh
# reads), the npm `latest` dist-tag and the `:latest` image on stable. A nightly
# whose `dev` has not moved since the last one is skipped, so idle days do not
# publish empty versions. Scheduled workflows only run from the default
# branch, so this file has to sit on `main` for the timer to fire at all.
on:
  schedule:
    # 19:17 UTC = 03:17 Asia/Shanghai. Off the hour on purpose: GitHub drops or
    # delays cron runs queued at high load, and the top of the hour is peak.
    - cron: '17 19 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the GitHub Release, npm and GHCR (default: dry run)'
        type: boolean
        default: false
      force:
        description: 'Rebuild even when dev has not moved since the last nightly'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      ref: ${{ steps.target.outputs.ref }}
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      release_name: ${{ steps.plan.outputs.release_name }}
      package_name: ${{ steps.plan.outputs.package_name }}
      npm_tag: ${{ steps.plan.outputs.npm_tag }}
      docker_tags: ${{ steps.plan.outputs.docker_tags }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      skip: ${{ steps.nightly.outputs.skip || 'false' }}
      previous_sha: ${{ steps.nightly.outputs.previous_sha }}
    steps:
      # The nightly tracks the integration branch, which is not the default
      # branch the schedule event reports; every other trigger builds its own ref.
      - name: Resolve the ref to build
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "ref=dev" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Resolve the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Plan the release
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ steps.target.outputs.ref }}
          SHA: ${{ steps.commit.outputs.sha }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: node .github/scripts/release-plan.mjs

      # The nightly tag rolls: it always points at the newest build, and the
      # commit it currently holds doubles as the baseline for the next notes.
      # An idle day must not mint a new version, so the same commit is skipped.
      - name: Check the rolling nightly tag
        id: nightly
        # force is the manual escape hatch: a dispatch is deliberate, the timer is not
        if: steps.plan.outputs.channel == 'nightly' && !inputs.force
        env:
          TAG: ${{ steps.plan.outputs.release_tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          # --verify --quiet: a missing tag must yield an empty string, not the ref name
          last="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)"
          echo "previous_sha=$last" >> "$GITHUB_OUTPUT"
          if [ -n "$last" ] && [ "$last" = "$SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG already points at $SHA — skipping this nightly"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The nightly is the dogfooding channel, so it only ships green code
      - name: Verify
        if: needs.prepare.outputs.channel == 'nightly'
        run: pnpm check && pnpm test && npm run test:server && pnpm test:release

      # Stamped once, then carried by the tarball, the npm package, the image and
      # the iOS bundle
      - name: Stamp version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: node .github/scripts/release-plan.mjs --set-version "$VERSION" "$BUILD"

      - run: pnpm build

      - name: Pack and verify the npm tarball
        run: node scripts/check-npm-pack.mjs

      - name: Package the release tarball
        run: tar czf agh-console.tar.gz dist server package.json

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            agh-console.tar.gz
            *.tgz

  # The only artifact that needs macOS. Built unsigned on purpose: CI has no
  # Apple certificate, and the IPA is meant to be re-signed by whoever installs
  # it (Sideloadly / AltStore / Xcode with their own Apple ID). The Tauri CLI's
  # IOS_CERTIFICATE / IOS_CERTIFICATE_PASSWORD / IOS_MOBILE_PROVISION env vars
  # are the hook if a signed IPA is ever wanted here.
  ios:
    needs: prepare
    # Being public is what lets the nightly carry an IPA: macOS minutes bill at
    # 10× on a private repository, where a daily build would eat the free
    # allowance and then stall every channel. Stable and a dispatch always run,
    # and so does a private repository's stable — only its nightly is skipped.
    if: >-
      needs.prepare.outputs.skip != 'true' &&
      (needs.prepare.outputs.channel == 'stable' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.repository.private == false)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Rust half dominates an iOS build; the cache keys off Cargo.lock.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # XcodeGen renders src-tauri/gen/apple/project.yml; the brew formula ships
      # the SettingPresets that scripts/ios-signing.sh asserts on.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Add the iOS Rust target
        run: rustup target add aarch64-apple-ios

      # Print what the Xcode script phase will look for: it shells out to
      # `pnpm run -- tauri ios xcode-script`, so node, pnpm and cargo all have to
      # be reachable from the build it inherits the environment from.
      - name: Check the toolchain
        run: |
          node -v && pnpm -v && cargo -V
          xcodebuild -version | head -n 2
          rustup target list --installed | grep -qx aarch64-apple-ios

      # ios-signing.sh reads .env.signing, which is machine-local by design. With
      # signing off the team id is only an XcodeGen placeholder, so the job runs
      # before any secret exists; set the two repository variables to keep the
      # CI bundle id in step with the one the local Mac builds.
      - name: Write the signing file
        env:
          AGH_APPLE_TEAM: ${{ vars.AGH_APPLE_TEAM }}
          AGH_BUNDLE_ID: ${{ vars.AGH_BUNDLE_ID }}
        run: |
          bundle_id="${AGH_BUNDLE_ID:-$(node -p "require('./src-tauri/tauri.conf.json').identifier")}"
          printf 'AGH_APPLE_TEAM=%s\nAGH_BUNDLE_ID=%s\n' "${AGH_APPLE_TEAM:-unsigned}" "$bundle_id" > .env.signing
          echo "bundle id: $bundle_id"

      # Same stamp as the build job: package.json decides what the UI reports
      # (vite.config.ts injects it, and tauri-cli runs pnpm build), and the iOS
      # project takes the core version with this run's number as the bundle
      # version. Must precede the build; xcodegen turns project.yml into the
      # app's Info.plist when the project is generated below.
      - name: Stamp version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: node .github/scripts/release-plan.mjs --set-version "$VERSION" "$BUILD"

      # The command the local Mac runs, plus --no-sign. pnpm build is not a step
      # of its own: tauri-cli runs build.beforeBuildCommand, and the frontend
      # ends up embedded in the Rust binary.
      - name: Build the IPA
        run: ./scripts/ios-signing.sh tauri build --target aarch64 --no-sign

      # Fixed asset name, like agh-console.tar.gz: the nightly release is
      # upserted in place, so a name carrying the version would pile up one IPA
      # per night instead of replacing the previous one.
      - name: Collect the IPA
        run: |
          ipa="$(find src-tauri/gen/apple/build -name '*.ipa' -print -quit)"
          if [ -z "$ipa" ]; then
            echo "::error::iOS 构建没有产出 ipa"
            exit 1
          fi
          mv "$ipa" agh-console.ipa
          # A zip that lost its Payload is still a valid ipa and would ship as
          # the release asset: assert the bundle is actually in there.
          unzip -l agh-console.ipa | grep -E 'Payload/.+\.app/Info\.plist' || {
            echo "::error::ipa 里没有 Payload/<App>.app/Info.plist"
            exit 1
          }
          # What the phone will report. tauri derives these from
          # tauri.conf.json#version (core) and the build number, so a nightly
          # shows the core version plus its run number rather than the full
          # nightly string — print them so the log carries that evidence.
          unzip -p agh-console.ipa 'Payload/*.app/Info.plist' > /tmp/ipa-Info.plist
          plutil -p /tmp/ipa-Info.plist | grep -E 'CFBundle(Short)?Version'

      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          if-no-files-found: error
          path: agh-console.ipa

  release:
    needs: [prepare, build, ios]
    # The iOS job must not be able to block the web, npm and image channels, and
    # it must not race them either (an IPA that arrives after the release has been
    # created would be missing from it), hence both the extra need and
    # !cancelled(). A failed build still blocks publishing: without its tarball
    # there is nothing to publish. The IPA step at the end attaches one only when
    # the macOS job actually produced it.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Prepare release notes
        env:
          # A nightly lists what landed since the previous nightly build
          BEFORE: ${{ needs.prepare.outputs.channel == 'nightly' && needs.prepare.outputs.previous_sha || github.event.before }}
          AFTER: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          BRANCH: ${{ needs.prepare.outputs.ref }}
        run: bash .github/scripts/release-notes.sh

      # One rolling nightly: the tag moves to the newest build and the release is
      # updated in place, so the release list never grows past a single entry.
      # Stable keeps one tag and one release per version.
      - name: Move the rolling nightly tag
        if: needs.prepare.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if gh api -X PATCH "repos/$REPO/git/refs/tags/$TAG" -f sha="$SHA" -F force=true >/dev/null 2>&1; then
            echo "moved $TAG to $SHA"
          else
            echo "$TAG is not there yet — the release creates it"
          fi

      - name: Generate release manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          NOTES_FILE: release-notes.md
          OUTPUT: version.json
        run: node scripts/generate-manifest.mjs

      # Upserts by tag: the nightly release is updated in place, and an asset
      # with the same name is replaced instead of piling up.
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          # github.sha is the default branch on a schedule event, so without this
          # the nightly tag would point at main instead of the dev commit it built
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: ${{ needs.prepare.outputs.release_name }}
          body_path: release-notes.md
          files: |
            agh-console.tar.gz
            version.json
          prerelease: ${{ needs.prepare.outputs.prerelease }}

      # The IPA rides along only when the macOS job produced one. A step of its
      # own, so a missing file can never fail the release upsert above; --clobber
      # replaces the asset the same way the tarball is replaced.
      - uses: actions/download-artifact@v8
        if: needs.ios.result == 'success'
        with:
          name: ios-ipa

      - name: Attach the IPA
        if: needs.ios.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: gh release upload "$TAG" agh-console.ipa --clobber --repo "$REPO"

  npm:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Trusted publishing: the registry trades this job's OIDC token for a publish
    # grant, so no npm credential is stored anywhere. The package carries the
    # matching configuration (type github, repository, workflow release.yml), and
    # npm only accepts publishes from that workflow. id-token is what makes the
    # exchange possible; without it npm finds no credential and fails.
    permissions:
      id-token: write
    env:
      PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets

      # No registry-url: it writes an .npmrc with a token placeholder, and npm
      # would fail on the unresolved variable instead of using OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The tarball is packed and verified by the build job; this step only ships
      # it, so what is published is exactly what was checked. --provenance works
      # now that the repository is public; the attestation is signed by the OIDC
      # identity above.
      - name: Publish the verified tarball
        run: |
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published — nothing to do"
            exit 0
          fi
          npm publish ./*.tgz --tag "$NPM_TAG" --provenance

  docker:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ needs.prepare.outputs.docker_tags }}
          # What Settings → About reports inside the image (vite.config.ts reads
          # APP_VERSION; see the Dockerfile for why this is not a stamped file)
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=AGH Console
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
