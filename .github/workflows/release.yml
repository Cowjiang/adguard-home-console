name: Release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Package
        run: tar czf agh-console.tar.gz dist server package.json

      - name: Compute version tag
        id: ver
        run: echo "tag=v0.1.0-dev.$(date +%Y%m%d).$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          TAG: ${{ steps.ver.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/release-notes.sh

      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: release-notes.md
          files: agh-console.tar.gz
